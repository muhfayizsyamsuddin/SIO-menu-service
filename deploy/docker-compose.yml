services:
  menu-db:
    image: postgres:16-alpine
    container_name: sio-menu-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sio-menu-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - menu-internal
    restart: unless-stopped

  menu-service:
    image: faizms14/sio-menu-service:latest
    container_name: sio-menu-service
    env_file:
      - .env
    networks:
      - menu-internal
      - sio-net
      - proxy_net
    depends_on:
      menu-db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy_net
      traefik.http.routers.sio-menu.rule: "Host(`api-sioms.faizms.com`) && PathPrefix(`/menus`)"
      traefik.http.routers.sio-menu.entrypoints: websecure
      traefik.http.routers.sio-menu.tls: "true"
      traefik.http.routers.sio-menu.tls.certresolver: myresolver
      traefik.http.services.sio-menu.loadbalancer.server.port: "3002"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: sio-menu-adminer
    # ports:
    #   - "8082:8080"
    depends_on:
      - menu-db
    networks:
      - sio-net

volumes:
  sio-menu-db-data:

networks:
  menu-internal:
    name: sio-menu-internal
  sio-net:
    external: true
  proxy_net:
    external: true


